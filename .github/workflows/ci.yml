name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Type check + lint ─────────────────────────────────────────────
  typecheck:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Lint
        run: npm run lint

  # ── Build check ───────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      # Des valeurs FACTICES, jamais de vrais secrets : ceux-la vivent dans
      # Vercel. Elles sont la parce que vingt-sept routes construisent leur
      # client Supabase ou Resend AU CHARGEMENT du module. Next.js importe
      # chaque route pour collecter ses metadonnees, et un constructeur qui
      # leve sur une clef absente fait echouer le build entier — alors
      # qu'aucun appel reseau n'est fait.
      #
      # La dette reelle est ce motif : un client construit a l'import rend
      # une route impossible a charger quand sa variable manque, avec une
      # erreur qui ne nomme pas le coupable. Ce sont deux lignes ici contre
      # vingt-sept fichiers a reecrire ; a faire au fil de l'eau.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
      NEXT_PUBLIC_APP_URL: https://nexora-mu-henna.vercel.app
      SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
      RESEND_API_KEY: re_placeholder_000000000000000000000000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: .next/
          retention-days: 3

  # ── Unit tests ───────────────────────────────────────────────────
  # Pure functions, no live server needed - runs on every push/PR and
  # actually gates deploy (unlike the integration job below, which hits
  # live prod and can't meaningfully block a deploy that hasn't happened
  # yet). This is what would have caught the selectBestModel bug where an
  # explicitly-chosen model got silently overridden by a complexity score.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx tsx tests/unit/models.test.ts

  # ── Integration tests ─────────────────────────────────────────────
  integration:
    name: Proxy Integration Tests
    runs-on: ubuntu-latest
    needs: build
    # Only run on main branch pushes (needs real proxy to be up)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run proxy integration tests
        # Ces tests tapent la prod déjà en ligne, en parallèle du déploiement
        # du nouveau code (pas un vrai gate pré-déploiement possible ici) -
        # mais avant, un échec total passait inaperçu (continue-on-error).
        # On le garde visible : ce n'est plus silencieux, même si ça ne
        # bloque encore rien.
        run: npx tsx tests/integration/proxy.test.ts
        env:
          PROXY_URL: https://nexora-mu-henna.vercel.app
          TEST_TOKEN: ${{ secrets.NEXORA_TEST_TOKEN }}

  # ── Deploy to Vercel (main branch only) ───────────────────────────
  # Il n'y a PAS de travail de deploiement ici, et c'est voulu.
  #
  # Il y en avait un : amondnet/vercel-action, qui echouait a chaque push
  # sur « Input required and not supplied: vercel-token ». Aucun secret
  # n'a jamais ete pose sur ce depot — il n'a donc jamais rien deploye.
  #
  # Et il n'avait pas lieu d'etre : Vercel deploie par sa propre
  # integration GitHub des que main bouge. Le remettre ferait courir deux
  # deploiements en parallele pour un seul commit.

  # ── Security audit ────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Warn but don't block

      - name: Check for exposed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true
